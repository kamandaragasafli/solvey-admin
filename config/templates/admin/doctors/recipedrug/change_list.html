{% extends "admin/change_list.html" %}

{% block filters %}
  {{ block.super }}
  <div style="margin: 10px 0; padding: 10px; background: #f8f9fa; border-radius: 4px;">
    <strong>Tarix intervalı:</strong>
    <input type="date" id="date_from" name="date_from" value="{{ request.GET.date_from|default:'' }}" style="margin: 0 5px;">
    <input type="date" id="date_to" name="date_to" value="{{ request.GET.date_to|default:'' }}" style="margin: 0 5px;">
    <button type="button" onclick="applyDateFilter()">Filtrlə</button>
    <button type="button" onclick="clearDateFilter()">Təmizlə</button>
  </div>
  <script>
    function applyDateFilter() {
      const dateFrom = document.getElementById('date_from').value;
      const dateTo = document.getElementById('date_to').value;
      const currentUrl = new URL(window.location.href);
      if (dateFrom) currentUrl.searchParams.set('date_from', dateFrom);
      else currentUrl.searchParams.delete('date_from');
      if (dateTo) currentUrl.searchParams.set('date_to', dateTo);
      else currentUrl.searchParams.delete('date_to');
      window.location = currentUrl.toString();
    }
    function clearDateFilter() {
      const currentUrl = new URL(window.location.href);
      currentUrl.searchParams.delete('date_from');
      currentUrl.searchParams.delete('date_to');
      window.location = currentUrl.toString();
    }
  </script>
{% endblock %}

{% block object-tools-items %}
  <li>
    <a href="{{ delete_daily_url }}" class="historylink" style="background:#ba2121;color:#ffc;padding:10px 15px;font-weight:bold;">
      Günlük bölgə üzrə qeydiyyatı sil
    </a>
  </li>
  {{ block.super }}
{% endblock %}
