{% extends "base.html" %}
{% block content %}
<div class="container py-4" style="max-width: 540px;">
  <div class="card border-0 shadow" style="background: #1f2937; color: #f9fafb;">
    <div class="card-header border-0 fw-semibold d-flex align-items-center gap-2 py-3"
         style="background: #111827; border-bottom: 1px solid #374151 !important; color: #e5e7eb;">
      <i class="bi bi-pencil-square text-primary"></i>
      Resept sətirini redaktə et
    </div>
    <div class="card-body px-4 py-4">
      <p class="small text-muted mb-1" style="color: #94a3b8 !important;">Həkim</p>
      <p class="mb-3 fw-semibold">{{ rd.recipe.dr.ad }}</p>
      <p class="small text-muted mb-1" style="color: #94a3b8 !important;">Dərman</p>
      <p class="mb-4 fw-semibold text-success">{{ rd.drug.med_name }}</p>

      <form method="post" action="{% url 'update_recipe' rd.id %}">
        {% csrf_token %}
        <div class="mb-3">
          <label for="number" class="form-label small">Say</label>
          <input type="number" name="number" id="number" step="0.1" min="0.1" required
                 value="{{ rd.number }}"
                 class="form-control"
                 style="background:#111827;color:#f9fafb;border:1px solid #4b5563;">
        </div>
        <div class="mb-3">
          <label for="date" class="form-label small">Resept tarixi</label>
          <input type="date" name="date" id="date" required
                 value="{{ rd.recipe.date|date:'Y-m-d' }}"
                 class="form-control"
                 style="background:#111827;color:#f9fafb;border:1px solid #4b5563;">
        </div>
        <div class="mb-4">
          <label for="region_id" class="form-label small">Bölgə</label>
          <select name="region_id" id="region_id" required
                  class="form-select"
                  style="background:#111827;color:#f9fafb;border:1px solid #4b5563;">
            {% for rg in regions %}
              <option value="{{ rg.id }}" {% if rg.id == rd.recipe.region_id %}selected{% endif %}>
                {{ rg.region_name }}
              </option>
            {% endfor %}
          </select>
          <p class="form-text small mt-2" style="color:#9ca3af;">
            Bu reseptə aid bütün sətirlər eyni tarix və bölgəni paylaşır; dəyişiklik hamısı üçün keçərlidir.
          </p>
        </div>
        <div class="d-flex justify-content-between gap-2 flex-wrap">
          <a href="{% url 'doctor_detail' rd.recipe.dr_id %}"
             class="btn btn-outline-secondary"
             style="border-color:#4b5563;color:#cbd5e1;">
            Geri
          </a>
          <button type="submit" class="btn btn-primary px-4" style="background:#2563eb;border:none;">
            Yadda saxla
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock content %}
