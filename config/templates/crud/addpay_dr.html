{% extends "base.html" %}
{% block content %}
<style>
  body { background-color: #030b1a; color: #f9fafb; font-family: "Inter", sans-serif; }
  .card { background-color: #273549; border: none; border-radius: 14px; color: #f9fafb; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35); }
  .form-label { font-weight: 500; color: #e5e7eb; }
  .form-select, .form-control { background-color: #374151; border: 1px solid #4b5563; color: #f9fafb; border-radius: 10px; padding: 10px; }
  .btn-success { background-color: #22c55e; border: none; border-radius: 10px; padding: 10px 18px; font-weight: 500; }
  
  /* Axtarış üçün yeni stildər */
  .doctor-dropdown-list { background-color: #374151; border: 1px solid #4b5563; max-height: 200px; overflow-y: auto; list-style: none; padding: 0; margin: 0; position: absolute; width: 100%; z-index: 1000; border-radius: 0 0 10px 10px; display: none; }
  .doctor-dropdown-list li { padding: 10px; cursor: pointer; color: #f9fafb; }
  .doctor-dropdown-list li:hover { background-color: #4b5563; }
</style>

<div class="container mt-5">
  <div class="card p-4">
    <h5 class="mb-4">Həkimə Ödəniş Əlavə Et</h5>
    <form method="POST" action="{% url 'add-pay-dr' %}">
      {% csrf_token %}
      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="payment_region_id" class="form-label">Bölgə Seç</label>
          <select class="form-select" name="region_id" id="payment_region_id" required>
            <option disabled selected>Bölgə Seçin</option>
            {% for r in region %}
              <option value="{{ r.id }}">{{ r.region_name }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="col-md-6 mb-3">
          <label for="doctor-search" class="form-label">Həkim Seç</label>
          <div class="position-relative">
            <input type="hidden" name="doctor_id" id="payment_doctor_id" required />
            <input type="text" id="doctor-search" class="form-control" style="background-color: #545c6b; color: #f9fafb; border: 1px solid #4b5563;"
                   placeholder="Əvvəlcə bölgə seçin..." autocomplete="off" disabled />
            <ul id="doctor-dropdown" class="doctor-dropdown-list"></ul>
          </div>
        </div>

        <div class="col-md-6 mb-3">
          <label for="payment_type" class="form-label">Ödəniş Növü</label>
          <select class="form-select" name="payment_type" id="payment_type" required>
            <option value="Avans">Avans</option>
            <option value="İnvest">İnvestisiya</option>
            <option value="Geri_qaytarma">Geri Qaytarma</option>
          </select>
        </div>
        <div class="col-md-6 mb-3">
          <label for="amount" class="form-label">Ödəniş Məbləği (₼)</label>
          <input type="number" class="form-control" name="amount" id="amount" min="0.01" step="0.01" required>
        </div>
        <div class="col-md-6 mb-3">
          <label for="pay_date" class="form-label">Tarix Seç</label>
          <input type="date" class="form-control" name="pay_date" id="pay_date" value="{% now 'Y-m-d' %}" required>
        </div>
      </div>
      <button type="submit" class="btn btn-success mt-2">Ödəniş Əlavə Et</button>
    </form>
  </div>
</div>
<script>
document.addEventListener("DOMContentLoaded", function () {
    const regionSelect = document.getElementById("payment_region_id");
    const doctorSearch = document.getElementById("doctor-search");
    const doctorDropdown = document.getElementById("doctor-dropdown");
    const doctorIdInput = document.getElementById("payment_doctor_id");

    let allDoctors = [];

    function normalizeAz(s) {
        return s.toLowerCase()
            .replace(/i̇/g, 'i')
            .replace(/ı/g, 'i')
            .replace(/ə/g, 'e')
            .replace(/ö/g, 'o')
            .replace(/ü/g, 'u')
            .replace(/ş/g, 's')
            .replace(/ç/g, 'c')
            .replace(/ğ/g, 'g');
    }

    function renderDropdown(filtered) {
        doctorDropdown.innerHTML = '';
        if (filtered.length === 0) {
            doctorDropdown.style.display = 'none';
            return;
        }
        doctorDropdown.style.display = 'block';
        filtered.forEach(doc => {
            const li = document.createElement("li");
            li.textContent = doc.ad;
            li.style.padding = "10px";
            li.style.cursor = "pointer";
            li.style.borderBottom = "1px solid #4b5563";
            li.onmouseover = () => li.style.backgroundColor = "#4b5563";
            li.onmouseout = () => li.style.backgroundColor = "transparent";
            li.onclick = () => {
                doctorSearch.value = doc.ad;
                doctorIdInput.value = doc.id;
                doctorDropdown.style.display = 'none';
            };
            doctorDropdown.appendChild(li);
        });
    }

    // Bölgə seçiləndə həkimləri BİR DƏFƏ yüklə
    regionSelect.addEventListener("change", function () {
        doctorSearch.disabled = false;
        doctorSearch.value = '';
        doctorIdInput.value = '';
        doctorDropdown.innerHTML = '';
        doctorDropdown.style.display = 'none';
        doctorSearch.placeholder = "Həkim adını yazın...";
        allDoctors = [];

        fetch(`/reports/ajax/get-doctors/?region_id=${encodeURIComponent(this.value)}`)
            .then(res => res.json())
            .then(data => { allDoctors = data.doctors || []; });
    });

    // Filter tamamilə JS-də — backend-ə sorğu yoxdur
    doctorSearch.addEventListener("input", function () {
        const query = normalizeAz(this.value.trim());
        if (!query) {
            doctorDropdown.style.display = 'none';
            return;
        }
        const filtered = allDoctors.filter(doc => normalizeAz(doc.ad).includes(query));
        renderDropdown(filtered);
    });

    // Kənara klikləyəndə gizlət
    document.addEventListener("click", (e) => {
        if (!doctorSearch.contains(e.target) && !doctorDropdown.contains(e.target)) {
            doctorDropdown.style.display = 'none';
        }
    });
});
  </script>
{% endblock content %}
