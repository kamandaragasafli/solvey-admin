<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş — Solvey Pharma</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        .login-container {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease;
        }

        .login-container:hover {
            transform: translateY(-5px);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo .ico {
            font-size: 54px;
            margin-bottom: 10px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .login-logo h2 {
            color: #2c3e50;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .login-logo p {
            color: #95a5a6;
            font-size: 14px;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .login-container label {
            font-size: 12px;
            font-weight: 700;
            color: #34495e;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: block;
            margin-bottom: 8px;
        }

        .login-container input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            color: #2c3e50;
            background-color: #f8fafc;
            transition: all 0.3s ease;
        }

        .login-container input:focus {
            outline: none;
            border-color: #3498db;
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #2980b9;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            box-shadow: 0 4px 12px rgba(41, 128, 185, 0.2);
        }

        .login-btn:hover {
            background: #2471a3;
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .xeta {
            background: #fdf2f2;
            color: #ec7063;
            border-left: 4px solid #e74c3c;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-logo">
        <div class="ico">
            <img src="{% static 'img/solvey logo.png' %}"style="widht:100%; height:50px"></div>
        <h2>Solvey Pharma</h2>
        <p>Vizit İdarəetmə Sistemi</p>
    </div>

    <!-- Django xəta mesajları bloku -->
    {% if xeta %}
    <div class="xeta">
        <span>⚠️</span> {{ xeta }}
    </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        
        <div class="form-group">
            <label for="login">Login</label>
            <input type="text" id="login" name="login" placeholder="İstifadəçi adı" value="{{ login_deyeri }}" required autofocus>
        </div>

        <div class="form-group">
            <label for="sifre">Şifrə</label>
            <input type="password" id="sifre" name="sifre" placeholder="••••••••" required>
        </div>

        <button type="submit" class="login-btn">Daxil ol →</button>
    </form>
</div>

<script>
// Login edildikdə konum göndər və form-u submit et
document.querySelector('form').addEventListener('submit', function(e) {
    e.preventDefault();

    function submitForm() {
        this.submit();
    }

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            function(position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;

                // Konum adını əldə et
                fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
                    .then(response => response.json())
                    .then(data => {
                        const locationName = data.display_name || '';

                        // API-ə göndər
                        fetch('/vizit/api/save-location/', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                            },
                            body: JSON.stringify({
                                latitude: lat,
                                longitude: lng,
                                location_name: locationName
                            })
                        })
                        .then(() => {
                            // Form-u submit et
                            document.querySelector('form').submit();
                        })
                        .catch(() => {
                            // Xəta olsa da form-u submit et
                            document.querySelector('form').submit();
                        });
                    })
                    .catch(() => {
                        // Konum adı olmadan göndər
                        fetch('/vizit/api/save-location/', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                            },
                            body: JSON.stringify({
                                latitude: lat,
                                longitude: lng,
                                location_name: ''
                            })
                        })
                        .then(() => {
                            document.querySelector('form').submit();
                        })
                        .catch(() => {
                            document.querySelector('form').submit();
                        });
                    });
            },
            function(error) {
                console.log('Konum icazəsi verilmədi:', error.message);
                // Konum icazəsi verilmədisə yine de form-u submit et
                document.querySelector('form').submit();
            }
        );
    } else {
        // Geolocation dəstəklənmirsə form-u submit et
        document.querySelector('form').submit();
    }
});
</script>

</body>
</html>
