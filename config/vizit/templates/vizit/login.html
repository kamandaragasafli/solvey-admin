{% load static %}
<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş — Solvey Pharma</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        .login-container {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease;
        }

        .login-container:hover {
            transform: translateY(-5px);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-logo .ico {
            margin-bottom: 14px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        .login-logo .ico img {
            height: 56px;
            width: auto;
            max-width: 220px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .login-logo h2 {
            color: #2c3e50;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .login-logo p {
            color: #95a5a6;
            font-size: 14px;
            margin-top: 5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .login-container label {
            font-size: 12px;
            font-weight: 700;
            color: #34495e;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: block;
            margin-bottom: 8px;
        }

        .login-container input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 15px;
            color: #2c3e50;
            background-color: #f8fafc;
            transition: all 0.3s ease;
        }

        .login-container input:focus {
            outline: none;
            border-color: #3498db;
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.1);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #2980b9;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            box-shadow: 0 4px 12px rgba(41, 128, 185, 0.2);
        }

        .login-btn:hover {
            background: #2471a3;
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .xeta {
            background: #fdf2f2;
            color: #ec7063;
            border-left: 4px solid #e74c3c;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-logo">
        <div class="ico">
            <img src="{% static 'img/solvey logo.png' %}" alt="Solvey Pharma">
        </div>
        <h2>Solvey Pharma</h2>
        <p>Vizit İdarəetmə Sistemi</p>
    </div>

    {% if xeta %}
    <div class="xeta">
        <span>⚠️</span> {{ xeta }}
    </div>
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label for="login">Login</label>
            <input type="text" id="login" name="login" placeholder="İstifadəçi adı" value="{{ login_deyeri }}" required autofocus>
        </div>

        <div class="form-group">
            <label for="sifre">Şifrə</label>
            <input type="password" id="sifre" name="sifre" placeholder="••••••••" required>
        </div>

        <button type="submit" class="login-btn">Daxil ol →</button>
    </form>
</div>

</body>
</html>
